<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width , initial-scale=1.0">
        <title>SnowMan</title>
        <style>
            body{
                /* background: -webkit-linear-gradient(left,#000000 5%, red 30%, green 55%,blue 80%, #ffffff 100%); */
                /* background: -webkit-radial-gradient(top, black, white) */
                background-color: rgb(0, 0, 60);
                text-align: center;
            }
            .snowBall{
                position: relative;
                background: whitesmoke;
                height: 100px;
                width: 100px;
                border-radius: 50%;
                display: inline-block;
                box-shadow: 0px 100px 0px 20px whitesmoke, 0px 100px 2px 21px #aaa, inset 0px -10px 10px rgb(200, 200, 200);
            }
            .snowBall::after{
                content:"";
                position: absolute;
                background: black;
                height: 15px;
                width: 15px;
                border-radius: 50%;
                display: inline-block;
                top:35px;
                left: 25px;
                box-shadow: 35px 0px, 
                    17px 15px 0px -1px orange,
                    0px 30px 0px -5px, 
                    -8px 25px 0px -5px, 
                    8px 33px 0px -5px, 
                    16px 34px 0px -5px, 
                    24px 33px 0px -5px, 
                    32px 30px 0px -5px, 
                    40px 25px 0px -5px,
                    
                    17px 70px,
                    17px 105px,
                    17px 140px;
            }
        </style>
    </head>
    <body>
        <div class="snowBall"></div>
    </body>
</html>
